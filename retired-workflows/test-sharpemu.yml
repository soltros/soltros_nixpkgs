name: Test SharpEmu Nix Package

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/sharpemu.nix'
      - 'flake.nix'
      - '.github/workflows/test-sharpemu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Evaluate SharpEmu
        run: nix eval --raw .#packages.x86_64-linux.sharpemu.name --show-trace
      - name: Build SharpEmu
        run: nix build .#sharpemu --show-trace -L --no-link --print-out-paths
      - name: Check package executable
        run: |
          output=$(nix build .#sharpemu --no-link --print-out-paths)
          test -x "$output/bin/sharpemu"
          echo "SharpEmu launcher present: $output/bin/sharpemu"
