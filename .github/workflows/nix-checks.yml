name: Nix checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        package: [chatgpt, waterfox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#packages.${{ matrix.system }}.${{ matrix.package }}.src" --print-build-logs

  build:
    strategy:
      fail-fast: false
      matrix:
        package:
          - supernova-desktop
          - cabinet-desktop
          - chatgpt
          - waterfox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#${{ matrix.package }} --print-build-logs
