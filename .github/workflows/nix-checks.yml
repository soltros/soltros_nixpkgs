name: Nix checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v

  source:
    strategy:
      fail-fast: false
      matrix:
        package: [chatgpt, waterfox, xenia-canary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#${{ matrix.package }}.src" --print-build-logs

  build:
    strategy:
      fail-fast: false
      matrix:
        package:
          - supernova-desktop
          - cabinet-desktop
          - chatgpt
          - waterfox
          - xenia-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#${{ matrix.package }} --print-build-logs
      - name: Check Xenia launcher
        if: matrix.package == 'xenia-canary'
        run: |
          test -x result/bin/xenia-canary
          grep -q '^Exec=xenia-canary %f$' result/share/applications/xenia-canary.desktop
