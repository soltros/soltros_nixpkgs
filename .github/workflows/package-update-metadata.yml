name: Package update metadata

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package hashes
        shell: bash
        run: |
          set -euo pipefail

          echo "=== ChatGPT amd64 ==="
          curl -fsSL "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages" |
            awk '/^Package: chatgpt$/{f=1} f && /^(Package|Version|Filename|SHA256):/{print} f && /^$/{exit}'

          echo "=== ChatGPT arm64 ==="
          curl -fsSL "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-arm64/Packages" |
            awk '/^Package: chatgpt$/{f=1} f && /^(Package|Version|Filename|SHA256):/{print} f && /^$/{exit}'

          echo "=== Waterfox 6.7.5 x86_64 ==="
          curl -fsSL -o waterfox-x86_64.tar.bz2 "https://cdn.waterfox.com/waterfox/releases/6.7.5/Linux_x86_64/waterfox-6.7.5.tar.bz2"
          sha256sum waterfox-x86_64.tar.bz2

          echo "=== Waterfox 6.7.5 aarch64 ==="
          curl -fsSL -o waterfox-aarch64.tar.bz2 "https://cdn.waterfox.com/waterfox/releases/6.7.5/Linux_aarch64/waterfox-6.7.5.tar.bz2"
          sha256sum waterfox-aarch64.tar.bz2
