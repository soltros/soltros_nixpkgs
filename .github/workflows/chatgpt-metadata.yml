name: ChatGPT package metadata

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official APT metadata
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "=== $arch ==="
            curl -fsSL "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-$arch/Packages" |
              awk '/^Package: chatgpt$/{f=1} f && /^(Package|Version|Filename|SHA256):/{print} f && /^$/{exit}'
          done
